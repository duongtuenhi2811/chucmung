<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" fill="none" role="img" aria-label="Bó hoa hồng phấn nhiều lớp cánh, hoa baby, lá xanh và giấy gói satin thắt nơ">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C5D9A2"/><stop offset=".48" stop-color="#71996B"/><stop offset="1" stop-color="#3F7254"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E4E9BE"/><stop offset=".52" stop-color="#91B47E"/><stop offset="1" stop-color="#527D5D"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4F7E5A"/><stop offset=".45" stop-color="#9BB987"/><stop offset="1" stop-color="#3F6D50"/>
    </linearGradient>
    <linearGradient id="paperMain" x1="110" y1="190" x2="345" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/><stop offset=".3" stop-color="#FFEFF2"/><stop offset=".68" stop-color="#F8CAD7"/><stop offset="1" stop-color="#EFA9C0"/>
    </linearGradient>
    <linearGradient id="paperLeft" x1="40" y1="214" x2="188" y2="409" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF6"/><stop offset=".55" stop-color="#FDEAF0"/><stop offset="1" stop-color="#F5C0D1"/>
    </linearGradient>
    <linearGradient id="paperRight" x1="403" y1="213" x2="252" y2="416" gradientUnits="userSpaceOnUse">
