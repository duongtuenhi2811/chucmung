<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" fill="none" role="img" aria-label="Bó hoa hồng phấn nhiều lớp cánh, hoa baby, lá xanh và giấy gói satin thắt nơ">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C5D9A2"/><stop offset=".48" stop-color="#71996B"/><stop offset="1" stop-color="#3F7254"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E4E9BE"/><stop offset=".52" stop-color="#91B47E"/><stop offset="1" stop-color="#527D5D"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4F7E5A"/><stop offset=".45" stop-color="#9BB987"/><stop offset="1" stop-color="#3F6D50"/>
    </linearGradient>
    <linearGradient id="paperMain" x1="110" y1="190" x2="345" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/><stop offset=".3" stop-color="#FFEFF2"/><stop offset=".68" stop-color="#F8CAD7"/><stop offset="1" stop-color="#EFA9C0"/>
    </linearGradient>
    <linearGradient id="paperLeft" x1="40" y1="214" x2="188" y2="409" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF6"/><stop offset=".55" stop-color="#FDEAF0"/><stop offset="1" stop-color="#F5C0D1"/>
    </linearGradient>
    <linearGradient id="paperRight" x1="403" y1="213" x2="252" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8F6"/><stop offset=".52" stop-color="#F9D6E0"/><stop offset="1" stop-color="#EBA1BA"/>
    </linearGradient>
    <linearGradient id="paperFold" x1="105" y1="255" x2="215" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4B9CD"/>
    </linearGradient>
    <linearGradient id="satin" x1="166" y1="324" x2="280" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD8E4"/><stop offset=".23" stop-color="#F9A9C4"/><stop offset=".52" stop-color="#EA709D"/><stop offset=".78" stop-color="#F7A4C0"/><stop offset="1" stop-color="#CF4F80"/>
    </linearGradient>
    <linearGradient id="tail" x1="190" y1="342" x2="230" y2="449" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F69BB9"/><stop offset=".4" stop-color="#F8C2D3"/><stop offset=".72" stop-color="#EA78A1"/><stop offset="1" stop-color="#D85C8B"/>
    </linearGradient>
    <radialGradient id="rosePetal" cx=".32" cy=".2" r=".9">
      <stop stop-color="#FFF9F8"/><stop offset=".28" stop-color="#FFD8E2"/><stop offset=".68" stop-color="#F3A0BA"/><stop offset="1" stop-color="#D9658C"/>
    </radialGradient>
    <radialGradient id="rosePetalDeep" cx=".3" cy=".16" r=".92">
      <stop stop-color="#FFE8ED"/><stop offset=".34" stop-color="#F5B0C4"/><stop offset=".74" stop-color="#DD759A"/><stop offset="1" stop-color="#BE4E78"/>
    </radialGradient>
    <radialGradient id="rosePetalLight" cx=".3" cy=".15" r=".95">
      <stop stop-color="#FFFEF9"/><stop offset=".45" stop-color="#FFE2E8"/><stop offset="1" stop-color="#F1A7BF"/>
    </radialGradient>
    <radialGradient id="baby" cx=".3" cy=".25" r=".8">
      <stop stop-color="#FFFFFF"/><stop offset=".68" stop-color="#FFF5F5"/><stop offset="1" stop-color="#EAC9D2"/>
    </radialGradient>
    <linearGradient id="flowerCenter" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8DC8F"/><stop offset="1" stop-color="#D99843"/>
    </linearGradient>
    <filter id="flowerShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.18 0 0 0 0 0.28 0 0 0 .23 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paperShadow" x="-25%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#A94F75" flood-opacity=".22"/>
    </filter>
    <filter id="softBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Individual hand-layered petals create a fuller, rose-like bloom. -->
    <g id="rose">
      <g stroke="#D96F94" stroke-opacity=".35" stroke-width=".8">
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetalDeep)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetal)" transform="rotate(45)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetalDeep)" transform="rotate(90)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetal)" transform="rotate(135)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetalDeep)" transform="rotate(180)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetal)" transform="rotate(225)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetalDeep)" transform="rotate(270)"/>
        <path d="M0 0 C-17 -4 -28 -18 -23 -31 C-19 -42 -6 -41 0 -30 C8 -42 21 -39 24 -28 C29 -14 15 -4 0 0Z" fill="url(#rosePetal)" transform="rotate(315)"/>
      </g>
      <g fill="url(#rosePetalLight)" stroke="#E995AF" stroke-opacity=".5" stroke-width=".7">
        <path d="M0 -2 C-13 -5 -19 -16 -13 -25 C-8 -32 -1 -27 2 -20 C10 -27 18 -18 14 -10 C11 -4 5 -1 0 -2Z" transform="rotate(17)"/>
        <path d="M0 -2 C-13 -5 -19 -16 -13 -25 C-8 -32 -1 -27 2 -20 C10 -27 18 -18 14 -10 C11 -4 5 -1 0 -2Z" transform="rotate(107)"/>
        <path d="M0 -2 C-13 -5 -19 -16 -13 -25 C-8 -32 -1 -27 2 -20 C10 -27 18 -18 14 -10 C11 -4 5 -1 0 -2Z" transform="rotate(197)"/>
        <path d="M0 -2 C-13 -5 -19 -16 -13 -25 C-8 -32 -1 -27 2 -20 C10 -27 18 -18 14 -10 C11 -4 5 -1 0 -2Z" transform="rotate(287)"/>
      </g>
      <g fill="url(#rosePetalDeep)" stroke="#D97999" stroke-width=".6">
        <path d="M0 1 C-9 -3 -12 -12 -7 -18 C-3 -23 3 -18 3 -13 C11 -16 14 -7 8 -2 C5 1 2 2 0 1Z" transform="rotate(0)"/>
        <path d="M0 1 C-9 -3 -12 -12 -7 -18 C-3 -23 3 -18 3 -13 C11 -16 14 -7 8 -2 C5 1 2 2 0 1Z" transform="rotate(120)"/>
        <path d="M0 1 C-9 -3 -12 -12 -7 -18 C-3 -23 3 -18 3 -13 C11 -16 14 -7 8 -2 C5 1 2 2 0 1Z" transform="rotate(240)"/>
      </g>
      <path d="M-4 -2 C-10 -10 -2 -17 4 -13 C9 -9 4 -4 0 -7 C-2 -9 -3 -5 0 -3 C5 0 10 -7 6 -13" stroke="#C9557F" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-15 -27 Q-12 -37 -4 -36" stroke="#FFF8F8" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    </g>
    <g id="peony">
      <g fill="url(#rosePetalLight)" stroke="#E5A0B4" stroke-width=".7" stroke-opacity=".6">
        <path d="M0 0 C-16 -4 -28 -18 -21 -33 C-17 -43 -7 -38 -2 -29 C5 -42 20 -38 22 -25 C25 -10 12 -3 0 0Z"/>
        <path d="M0 0 C-16 -4 -28 -18 -21 -33 C-17 -43 -7 -38 -2 -29 C5 -42 20 -38 22 -25 C25 -10 12 -3 0 0Z" transform="rotate(60)"/>
        <path d="M0 0 C-16 -4 -28 -18 -21 -33 C-17 -43 -7 -38 -2 -29 C5 -42 20 -38 22 -25 C25 -10 12 -3 0 0Z" transform="rotate(120)"/>
        <path d="M0 0 C-16 -4 -28 -18 -21 -33 C-17 -43 -7 -38 -2 -29 C5 -42 20 -38 22 -25 C25 -10 12 -3 0 0Z" transform="rotate(180)"/>
        <path d="M0 0 C-16 -4 -28 -18 -21 -33 C-17 -43 -7 -38 -2 -29 C5 -42 20 -38 22 -25 C25 -10 12 -3 0 0Z" transform="rotate(240)"/>
        <path d="M0 0 C-16 -4 -28 -18 -21 -33 C-17 -43 -7 -38 -2 -29 C5 -42 20 -38 22 -25 C25 -10 12 -3 0 0Z" transform="rotate(300)"/>
      </g>
      <g fill="url(#rosePetal)" stroke="#D97D9D" stroke-opacity=".4" stroke-width=".6">
        <path d="M0 0 C-13 -2 -18 -13 -10 -22 C-4 -29 5 -23 5 -17 C14 -23 21 -12 13 -4 C9 0 4 2 0 0Z"/>
        <path d="M0 0 C-13 -2 -18 -13 -10 -22 C-4 -29 5 -23 5 -17 C14 -23 21 -12 13 -4 C9 0 4 2 0 0Z" transform="rotate(90)"/>
        <path d="M0 0 C-13 -2 -18 -13 -10 -22 C-4 -29 5 -23 5 -17 C14 -23 21 -12 13 -4 C9 0 4 2 0 0Z" transform="rotate(180)"/>
        <path d="M0 0 C-13 -2 -18 -13 -10 -22 C-4 -29 5 -23 5 -17 C14 -23 21 -12 13 -4 C9 0 4 2 0 0Z" transform="rotate(270)"/>
      </g>
      <ellipse rx="6.5" ry="5.8" fill="url(#flowerCenter)"/>
      <g fill="#FFF0BD"><circle cx="-2" cy="-1" r="1.2"/><circle cx="2" cy="1" r="1.2"/><circle cx="1" cy="-2.7" r=".9"/></g>
    </g>
    <g id="leaf-shape">
      <path d="M0 0 C-17 -7 -28 -25 -22 -42 C-5 -40 7 -27 0 0Z" fill="url(#leaf)" stroke="#4D7959" stroke-width="1"/>
      <path d="M0 -1 Q-8 -20 -20 -38" stroke="#D4E4AF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
      <path d="M-8 -18 L-20 -21 M-4 -11 L-15 -8 M-12 -28 L-22 -30" stroke="#D4E4AF" stroke-width=".8" stroke-linecap="round" opacity=".65"/>
    </g>
    <g id="baby-sprig" stroke="#8BAA79" stroke-width="1.5" stroke-linecap="round" fill="url(#baby)">
      <path d="M0 20 Q4 0 0 -21 M0 5 L-12 -5 M1 0 L13 -9 M0 -10 L-8 -19 M0 11 L12 6" fill="none"/>
      <g stroke="#EAD8DC" stroke-width=".7"><circle cx="0" cy="-22" r="5"/><circle cx="-13" cy="-5" r="4.1"/><circle cx="14" cy="-9" r="4.5"/><circle cx="-9" cy="-20" r="3.6"/><circle cx="12" cy="6" r="4"/><circle cx="0" cy="0" r="4.3"/></g>
      <g fill="#FFFDFB" stroke="none"><circle cx="-1" cy="-23" r="1.2"/><circle cx="-13" cy="-6" r="1"/><circle cx="14" cy="-10" r="1.2"/></g>
    </g>
  </defs>

  <!-- Graceful stems and eucalyptus-like foliage -->
  <g stroke="url(#stem)" stroke-width="4" stroke-linecap="round" opacity=".96">
    <path d="M220 376 Q172 270 75 143"/><path d="M221 376 Q174 237 123 102"/>
    <path d="M220 377 Q215 205 207 65"/><path d="M221 376 Q258 225 301 102"/>
    <path d="M222 377 Q300 268 365 151"/><path d="M220 378 Q135 288 94 222"/>
    <path d="M222 378 Q305 291 345 222"/><path d="M221 372 Q202 256 166 183"/>
  </g>
  <g>
    <use href="#leaf-shape" transform="translate(126 246) rotate(-45) scale(1.03)"/>
    <use href="#leaf-shape" transform="translate(151 282) rotate(48) scale(.9)"/>
    <use href="#leaf-shape" transform="translate(154 213) rotate(-32) scale(.88)"/>
    <use href="#leaf-shape" transform="translate(177 260) rotate(49) scale(.8)"/>
    <use href="#leaf-shape" transform="translate(278 242) rotate(35) scale(.92)"/>
    <use href="#leaf-shape" transform="translate(294 274) rotate(65) scale(.86)"/>
    <use href="#leaf-shape" transform="translate(260 219) rotate(40) scale(.84)"/>
    <use href="#leaf-shape" transform="translate(109 287) rotate(-63) scale(.72)"/>
    <use href="#leaf-shape" transform="translate(322 292) rotate(75) scale(.74)"/>
    <use href="#leaf-shape" transform="translate(210 218) rotate(-5) scale(.7)"/>
  </g>

  <!-- Tiny baby's-breath sprays between larger blooms -->
  <g opacity=".98">
    <use href="#baby-sprig" transform="translate(85 159) rotate(-23) scale(.92)"/>
    <use href="#baby-sprig" transform="translate(148 111) rotate(-9) scale(.94)"/>
    <use href="#baby-sprig" transform="translate(198 89) rotate(8) scale(1.02)"/>
    <use href="#baby-sprig" transform="translate(292 111) rotate(20) scale(.95)"/>
    <use href="#baby-sprig" transform="translate(352 159) rotate(28) scale(.92)"/>
    <use href="#baby-sprig" transform="translate(115 207) rotate(-30) scale(.8)"/>
    <use href="#baby-sprig" transform="translate(323 211) rotate(27) scale(.8)"/>
  </g>

  <!-- Different flower sizes and tones add a natural, layered bouquet. -->
  <g filter="url(#flowerShadow)">
    <g transform="translate(78 151) rotate(-13) scale(.79)"><use href="#rose"/></g>
    <g transform="translate(129 110) rotate(7) scale(.88)"><use href="#peony"/></g>
    <g transform="translate(199 77) rotate(-8) scale(1.03)"><use href="#rose"/></g>
    <g transform="translate(280 109) rotate(12) scale(.9)"><use href="#peony"/></g>
    <g transform="translate(355 153) rotate(18) scale(.77)"><use href="#rose"/></g>
    <g transform="translate(112 204) rotate(-18) scale(.6)"><use href="#peony"/></g>
    <g transform="translate(326 207) rotate(17) scale(.64)"><use href="#rose"/></g>
    <g transform="translate(161 177) rotate(7) scale(.68)"><use href="#rose"/></g>
    <g transform="translate(244 174) rotate(-6) scale(.69)"><use href="#peony"/></g>
    <g transform="translate(210 205) rotate(16) scale(.55)"><use href="#rose"/></g>
  </g>

  <!-- Translucent wrapping paper; layered folds catch the light differently. -->
  <g filter="url(#paperShadow)">
    <path d="M37 195 Q76 175 131 211 L205 387 Q139 367 88 318 Q53 277 37 195Z" fill="url(#paperLeft)" stroke="#FFFDF8" stroke-width="2.4"/>
    <path d="M403 195 Q364 175 309 211 L235 387 Q301 367 352 318 Q387 277 403 195Z" fill="url(#paperRight)" stroke="#FFFDF8" stroke-width="2.4"/>
    <path d="M43 201 Q220 266 397 201 L307 415 Q220 451 133 415Z" fill="url(#paperMain)" stroke="#FFFDF8" stroke-width="2.8"/>
    <path d="M43 201 Q107 230 176 249 L133 415 Q77 348 43 201Z" fill="url(#paperFold)" opacity=".7"/>
    <path d="M397 201 Q333 230 264 249 L307 415 Q363 348 397 201Z" fill="#F2B5C9" opacity=".56"/>
    <path d="M79 215 Q108 302 169 393" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".82"/>
    <path d="M104 229 Q147 294 190 390" stroke="#ECA8BF" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
    <path d="M359 215 Q330 302 271 393" stroke="#FFFDF9" stroke-width="4.5" stroke-linecap="round" opacity=".92"/>
    <path d="M335 229 Q293 294 250 390" stroke="#E79DB7" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    <path d="M140 260 Q164 320 203 385" stroke="#FFFFFF" stroke-width="2" opacity=".7"/>
    <path d="M300 260 Q276 320 237 385" stroke="#FCEBF0" stroke-width="2" opacity=".86"/>
    <path d="M133 415 Q220 433 307 415" stroke="#D985A4" stroke-width="2" opacity=".25"/>
  </g>

  <!-- Satin bow with deep folds, gleaming edges and long curling tails. -->
  <g filter="url(#flowerShadow)">
    <path d="M205 337 C186 359 166 394 153 436 C179 420 205 396 224 369Z" fill="url(#tail)" stroke="#FFDCE7" stroke-width="2.1"/>
    <path d="M236 337 C257 359 279 396 291 436 C264 418 239 395 217 369Z" fill="url(#tail)" stroke="#FFDCE7" stroke-width="2.1"/>
    <path d="M183 342 Q148 307 166 300 Q191 298 219 329 Q242 299 269 306 Q292 318 253 348 L224 363Z" fill="url(#satin)" stroke="#FFDCE7" stroke-width="3"/>
    <path d="M173 307 Q185 306 207 330 L220 342 L202 351 Q178 335 173 307Z" fill="#FFD2E1" stroke="#F9B0C8" stroke-width="1.4"/>
    <path d="M267 309 Q253 307 232 330 L220 342 L240 352 Q261 335 267 309Z" fill="#E96D9A" stroke="#F7A6C1" stroke-width="1.4"/>
    <path d="M179 312 Q189 318 203 337" stroke="#FFF2F7" stroke-width="2.3" stroke-linecap="round" opacity=".9"/>
    <path d="M262 313 Q250 320 237 337" stroke="#FFD5E2" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="220" cy="343" rx="17.5" ry="16" fill="url(#satin)" stroke="#FFE7EE" stroke-width="3"/>
    <ellipse cx="214" cy="338" rx="5" ry="4" fill="#FFD9E5" opacity=".9"/>
    <path d="M211 343 Q220 351 229 343" stroke="#C64D7B" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
    <path d="M163 422 Q173 414 184 407" stroke="#FFE5ED" stroke-width="2" stroke-linecap="round" opacity=".72"/>
    <path d="M280 421 Q267 410 257 402" stroke="#FFE5ED" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  </g>
  <!-- Delicate dew-like highlights on the wrapper and petals. -->
  <g fill="#FFFFFF" opacity=".85" filter="url(#softBloom)">
    <circle cx="91" cy="181" r="2.2"/><circle cx="347" cy="183" r="2.1"/><circle cx="160" cy="236" r="1.5"/><circle cx="288" cy="232" r="1.7"/>
    <circle cx="120" cy="267" r="1.2"/><circle cx="321" cy="274" r="1.3"/><circle cx="198" cy="147" r="1.3"/><circle cx="278" cy="149" r="1.2"/>
  </g>
</svg>
