    <use href="#leaf-shape" transform="translate(210 218) rotate(-5) scale(.7)"/>
    <use href="#leaf-shape" transform="translate(98 187) rotate(-57) scale(.72)"/>
    <use href="#leaf-shape" transform="translate(147 193) rotate(48) scale(.68)"/>
