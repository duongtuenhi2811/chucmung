        <path d="M0 2 C-12 1 -26 -7 -28 -19 C-30 -30 -21 -37 -13 -32 C-6 -27 -3 -16 0 -7 C4 -19 12 -32 22 -30 C32 -28 33 -16 26 -7 C19 1 8 5 0 2Z" fill="url(#rosePetalDeep)" transform="rotate(311)"/>
      </g>
